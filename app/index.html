/* Style « Lecture » : fond sombre, accent violet, verre dépoli, grands arrondis. La feuille reste blanche comme le Word final. */
:root{
  --bg:#08080C;--fg:#F4F4F8;--mute:#A7A7BC;--dim:#8E8EA6;--card:rgba(255,255,255,.06);--card2:rgba(255,255,255,.1);--line:rgba(255,255,255,.12);
  --glass:rgba(28,28,39,.78);--sheetbg:rgba(24,24,34,.96);--acc:#6A5BFF;--acc2:#9AA8FF;--good:#6BE8A8;--bad:#ff7a85;
  --panel:#1b1b26;--soft:rgba(106,91,255,.24);--accent:#6A5BFF;--accent-fg:#fff;--hov:rgba(255,255,255,.08);
  --sys:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--serif:Newsreader,Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;overflow-x:clip;background:var(--bg);color:var(--fg);font:14px/1.45 var(--sys)}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
svg{display:block;flex:none}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.serif{font-family:var(--serif)}
.glow{position:fixed;left:50%;top:-220px;width:700px;height:380px;margin-left:-350px;border-radius:50%;background:#6A5BFF;filter:blur(150px);opacity:.22;pointer-events:none;z-index:0}

/* Erreurs et messages */
#err{display:none;position:fixed;z-index:200;left:14px;right:14px;top:84px;max-width:760px;margin:0 auto;padding:14px;border-radius:18px;background:#3a1216;color:#ffd7da;border:1px solid #7a2a31;box-shadow:0 10px 30px rgba(0,0,0,.45)}
#err b{color:#fff}#err pre{white-space:pre-wrap;word-break:break-word;font:12px var(--mono);margin:8px 0 0;max-height:34vh;overflow:auto;color:#ffc2c7}
#toast{position:fixed;z-index:180;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));background:#2a2a36;color:#fff;padding:10px 16px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:90vw;text-align:center;display:none}

/* Barre du haut */
.top{position:sticky;top:0;z-index:30;height:68px;display:flex;align-items:center;gap:12px;padding:0 max(18px,env(safe-area-inset-left,0px));background:var(--glass);
  -webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700;letter-spacing:-.02em;height:44px;padding-right:8px;border-radius:14px}
.brand i{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;color:#fff}
.sp{flex:1}
.docname{display:flex;flex-direction:column;line-height:1.2;min-width:0;max-width:300px}
.docname b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.docname span{font-size:12px;color:var(--mute)}
.docname span.bad{color:var(--bad)}
.seg{display:flex;gap:4px;padding:4px;border-radius:18px;background:var(--card)}
.seg button{min-height:36px;padding:0 16px;border-radius:14px;font-weight:600;font-size:13px;color:var(--mute);white-space:nowrap}
.seg button[aria-pressed="true"],.seg button.on{background:var(--acc);color:#fff}
.seg.soft button[aria-pressed="true"],.seg.soft button.on{background:var(--card2);color:var(--acc2)}
.pill{height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:var(--card2);font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.pill:hover{border-color:rgba(154,168,255,.55)}
.pill.act{border-color:rgba(106,91,255,.75);background:rgba(106,91,255,.22);color:#D5DAFF}
.go{height:44px;padding:0 20px;border-radius:22px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-weight:600;font-size:15px;display:flex;align-items:center;gap:9px;white-space:nowrap;box-shadow:0 10px 26px rgba(106,91,255,.4)}
.go.full{width:100%;justify-content:center;height:52px;border-radius:20px}
.ghost{width:100%;height:48px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:8px}
.ghost:hover{border-color:rgba(154,168,255,.55)}
.ghost.danger{color:var(--bad)}
.dots{display:flex;gap:3px}.dots i{width:12px;height:12px;border-radius:50%;display:block;border:1px solid rgba(255,255,255,.3)}
.menu{position:relative}
.menu .pop{display:none;position:absolute;right:0;top:calc(100% + 10px);min-width:290px;background:var(--sheetbg);border:1px solid var(--line);border-radius:22px;padding:8px;box-shadow:0 24px 60px rgba(0,0,0,.55);
  -webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);z-index:40}
.menu.open .pop{display:block}
.pop button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:14px;text-align:left;padding:11px 14px;border-radius:14px;font-weight:600}
.pop button:hover{background:var(--card2)}
.pop small{color:var(--mute);font-weight:500}.pop hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.pop .note{padding:6px 14px 8px;color:var(--mute);font-size:12px;line-height:16px}

/* Accueil : Mes TP */

<script>
/* ===== Docline : cœur (modèle, structures, éditeur) ===== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const uid=()=>Math.random().toString(36).slice(2,9);
const OLDKEY='cr-tp-doc-v1';

/* Erreurs : jamais silencieuses, la cause s'affiche en haut de la page */
function showErr(e,ctx){
  const box=$('#err');if(!box)return;
  const msg=(e&&e.message)?e.message:String(e);
  const st=(e&&e.stack)?String(e.stack).split('\n').slice(0,3).join('\n'):'';
  box.innerHTML='<b>Erreur'+(ctx?' ('+esc(ctx)+')':'')+' :</b> '+esc(msg)+(st?'<pre>'+esc(st)+'</pre>':'')+
    '<pre>Ferme ce message en cliquant dessus. Si ça se répète, envoie-moi cette ligne.</pre>';
  box.style.display='block';box.onclick=()=>{box.style.display='none'};
}
window.addEventListener('error',e=>showErr(e.error||e.message,'script'));
window.addEventListener('unhandledrejection',e=>showErr(e.reason,'promesse'));
let tT;function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tT);tT=setTimeout(()=>t.style.display='none',3800)}

/* Types de blocs */

/* ===== Modèle d'un TP ===== */
const clone=o=>JSON.parse(JSON.stringify(o));
function newDoc(blocks,meta,style){
  return {v:2,id:'tp-'+Date.now().toString(36)+uid().slice(0,3),updated:Date.now(),
    meta:Object.assign({titre:'Nouveau TP',module:'',nom:'',classe:'BTS CIEL',date:new Date().toISOString().slice(0,10),prof:'',etab:''},meta||{}),
    style:clone(style||layoutById(prefs().layout)),cover:prefs().cover,toc:prefs().toc,opts:{marks:prefs().marks,smart:prefs().smart},blocks:blocks||[]};
}
function ensureDoc(d){
  if(!d||!Array.isArray(d.blocks))throw new Error('Ce fichier n’est pas un compte rendu (pas de liste de blocs).');
  const base=newDoc([]);
  d.id=d.id||base.id;d.updated=d.updated||Date.now();d.v=2;
  d.meta=Object.assign(base.meta,d.meta||{});d.opts=Object.assign({marks:true,smart:true},d.opts||{});
  if(d.cover===undefined)d.cover=true;if(d.toc===undefined)d.toc=true;
  d.blocks.forEach(b=>{if(!b.id)b.id=uid()});
  ensureStyle(d);return d;
}
function fmtDate(s){if(!s)return'';const p=s.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s}
function ago(t){
  const s=(Date.now()-t)/1000;if(s<60)return'à l’instant';if(s<3600)return'il y a '+Math.floor(s/60)+' min';
  const d=new Date(t),n=new Date(),y=new Date(n-864e5);const hm=d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  if(d.toDateString()===n.toDateString())return'aujourd’hui, '+hm;if(d.toDateString()===y.toDateString())return'hier, '+hm;
  return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
}
function numbers(d){
  const m={};let a=0,b=0,c=0,fig=0,tab=0,cod=0,q=0;
  d.blocks.forEach(x=>{
    if(x.type==='titre'){
      if(x.level===1){a++;b=0;c=0;m[x.id]=a+'.'}
      else if(x.level===2){b++;c=0;m[x.id]=(a||1)+'.'+b}
      else{c++;m[x.id]=(a||1)+'.'+(b||1)+'.'+c}
    }else if(x.type==='question'){if(d.style&&d.style.qnum)m[x.id]='Question '+(++q)}else if(x.type==='image'&&x.src)m[x.id]='Figure '+(++fig);
    else if(x.type==='tableau')m[x.id]='Tableau '+(++tab);
    else if(x.type==='code'&&x.cap)m[x.id]='Code '+(++cod);
  });
  REFS={};d.blocks.forEach(x=>{if(m[x.id]&&x.type!=='titre'&&x.type!=='question')REFS[x.id]=m[x.id]});
  return m;
}
function docStats(d){
  const t={q:0,fig:0,tab:0,code:0,filled:0,sections:0};let cur=null;const secs=[];
  d.blocks.forEach(b=>{
    if(b.type==='titre'&&b.level===1){cur={t:b.text,f:false};secs.push(cur)}
    else{
      if(b.type==='question')t.q++;if(b.type==='image'&&b.src)t.fig++;if(b.type==='tableau')t.tab++;if(b.type==='code')t.code++;
      const has=(b.text&&b.text.trim()&&b.type!=='titre')||(b.src)||(b.type==='tableau'&&b.rows.slice(1).some(r=>r.some(c=>c.trim())));
      if(cur&&has)cur.f=true}
  });
  t.sections=secs.length;t.filled=secs.filter(s=>s.f).length;return t;
}

  const fr=new FileReader();fr.onerror=()=>showErr(new Error('Lecture impossible : '+f.name),'import thèmes');
  fr.onload=()=>{try{const a=JSON.parse(fr.result);if(!Array.isArray(a)||a.some(x=>!x||!x.roles||!x.name))throw new Error('Ce fichier ne contient pas de thèmes valides.');
    const cur=customThemes();a.forEach(t=>{t.id=t.id||('c-'+t.name.toLowerCase().replace(/[^a-z0-9]+/g,'-'));const i=cur.findIndex(x=>x.id===t.id);if(i>=0)cur[i]=t;else cur.push(t)});
    saveCustom(cur);refreshStyle();toast(a.length+' thème(s) importé(s)')}catch(e){showErr(e,'import thèmes')}};fr.readAsText(f);
}
function bindStyle(p){
  p.addEventListener('click',e=>{
    const d=e.target.closest('[data-thdel]');if(d){e.stopPropagation();delTheme(d.dataset.thdel);return}
    const t=e.target.closest('[data-th]');if(t){pickTheme(t.dataset.th);return}
    const r=e.target.closest('[data-role]');if(r){styleRole=r.dataset.role;refreshStyle();return}
    const c=e.target.closest('[data-col]');if(c){curStyle().roles[styleRole].color=c.dataset.col;liveStyle();refreshStyle();return}
    const st=e.target.closest('[data-step]');if(st){const o=curStyle().roles[styleRole];o.size=Math.min(48,Math.max(7,+(o.size+ +st.dataset.step).toFixed(1)));liveStyle();refreshStyle();return}
    const g=e.target.closest('[data-tg]');if(g){const k=g.dataset.tg,o=curStyle().roles[styleRole];o[k]=o[k]?0:1;g.setAttribute('aria-pressed',!!o[k]);liveStyle();return}
    const tg=e.target.closest('[data-tgl]');if(tg){
      const f=tg.dataset.tgl;if(f==='qnum'){curStyle().qnum=!curStyle().qnum;liveStyle();refreshStyle();return}
      const o=curStyle().roles[styleRole];const inp=tg.parentNode.querySelector('input[type=color]');
      o[f]=o[f]?'':inp.value;liveStyle();refreshStyle();return}
    const a=e.target.closest('[data-act2]');if(!a)return;
    const k=a.dataset.act2;if(k==='thsave'||k==='thnew')saveTheme();else if(k==='thexp')expThemes();else if(k==='thimp')$('#fThemes').click();
  });
  p.addEventListener('input',e=>{
    const t=e.target,f=t.dataset.sf;if(!f)return;const o=curStyle().roles[styleRole];let v=t.value;
    if(f==='size'){v=parseFloat(v);if(!(v>=7&&v<=48))return}
    o[f]=v;liveStyle();
  });
  p.addEventListener('change',e=>{if(e.target.dataset.sf){const k=e.target.dataset.sf;if(k==='color'||k==='bg'||k==='bar')refreshStyle()}});
}
/* ===== Bibliothèque « Mes TP » : IndexedDB, repli localStorage, dossier sur la clé (Chrome/Edge) ===== */
const store=(()=>{
  let db=null,mode='idb';
  const LS='cr-lib2-';
  function open(){
    return new Promise((ok,ko)=>{
      if(!window.indexedDB)return ko(new Error('IndexedDB absent'));
      let r;try{r=indexedDB.open('compte-rendu-tp',1)}catch(e){return ko(e)}
      r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('docs'))d.createObjectStore('docs',{keyPath:'id'});if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv')};
      r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error||new Error('Ouverture IndexedDB refusée'));r.onblocked=()=>ko(new Error('IndexedDB bloquée'));
    });
  }
  const req=(st,m,...a)=>new Promise((ok,ko)=>{const t=db.transaction(st,m==='get'||m==='getAll'?'readonly':'readwrite');const q=t.objectStore(st)[m](...a);
    t.oncomplete=()=>ok(q.result);t.onerror=()=>ko(t.error);t.onabort=()=>ko(t.error||new Error('Transaction annulée'))});
  const lsIds=()=>{try{return JSON.parse(localStorage.getItem(LS+'ids')||'[]')}catch(e){return[]}};
  return{
    get mode(){return mode},
    async init(){
      try{db=await open();mode='idb'}catch(e){mode='ls';console.warn('Repli localStorage :',e)}
      return mode;
    },
    async all(){
      if(mode==='idb')return(await req('docs','getAll')).sort((a,b)=>b.updated-a.updated);
      return lsIds().map(id=>{try{return JSON.parse(localStorage.getItem(LS+id))}catch(e){return null}}).filter(Boolean).sort((a,b)=>b.updated-a.updated);
    },
    async get(id){
      if(mode==='idb')return req('docs','get',id);
      const r=localStorage.getItem(LS+id);return r?JSON.parse(r):null;
    },
    async put(d){
      if(mode==='idb')return req('docs','put',d);
      const ids=lsIds();if(!ids.includes(d.id)){ids.push(d.id);localStorage.setItem(LS+'ids',JSON.stringify(ids))}
      localStorage.setItem(LS+d.id,JSON.stringify(d));
    },
    async del(id){
      if(mode==='idb')return req('docs','delete',id);
      localStorage.removeItem(LS+id);localStorage.setItem(LS+'ids',JSON.stringify(lsIds().filter(x=>x!==id)));
    },
    async kvGet(k){if(mode!=='idb')return null;return req('kv','get',k)},
    async kvSet(k,v){if(mode!=='idb')return;return req('kv','put',v,k)},
    async kvDel(k){if(mode!=='idb')return;return req('kv','delete',k)}
  };
})();

/* Dossier sur la clé : une copie .json de chaque TP, mise à jour à chaque sauvegarde */
const folder={
  h:null,state:'none', // none | ok | ask | off
  supported:()=>typeof window.showDirectoryPicker==='function',
  async init(){
    if(!this.supported())return this.state='off';
    try{
      const h=await store.kvGet('folder');if(!h)return this.state='none';
      this.h=h;const p=await h.queryPermission({mode:'readwrite'});this.state=p==='granted'?'ok':'ask';
    }catch(e){this.state='none'}
    return this.state;
  },
  async connect(){
    const h=await window.showDirectoryPicker({mode:'readwrite'});
    this.h=h;this.state='ok';await store.kvSet('folder',h);return h;
  },
  async regrant(){
    if(!this.h)return;const p=await this.h.requestPermission({mode:'readwrite'});this.state=p==='granted'?'ok':'ask';return this.state;
  },
  async forget(){this.h=null;this.state='none';await store.kvDel('folder')},
  fname:d=>(d.meta.titre||'tp').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-+|-+$/g,'').toLowerCase().slice(0,50)+'-'+d.id.slice(-4)+'.tp.json',
  async write(d){
    if(this.state!=='ok')return;
    const fh=await this.h.getFileHandle(this.fname(d),{create:true});const w=await fh.createWritable();await w.write(JSON.stringify(d));await w.close();
  },
  async readAll(){
    const out=[];
    for await(const [n,e] of this.h.entries()){
      if(e.kind==='file'&&/\.tp\.json$/i.test(n)){try{out.push(JSON.parse(await(await e.getFile()).text()))}catch(x){}}
    }
    return out;
  }
};
/* ===== Rendu final + exports (HTML, MD, TXT, DOCX, PDF) ===== */
const TOK=/(\*\*[^*\n]+\*\*|\*[^*\n]+\*|`[^`\n]+`)/;
function runs(s){
  return String(s||'').split(TOK).filter(x=>x!=='').map(p=>{
    if(p.length>4&&/^\*\*.+\*\*$/.test(p))return{t:p.slice(2,-2),b:1};
    if(p.length>2&&/^`.+`$/.test(p))return{t:p.slice(1,-1),c:1};
    if(p.length>2&&/^\*.+\*$/.test(p))return{t:p.slice(1,-1),i:1};
    return{t:p};
  });
}
const inl=s=>runs(s).map(r=>{const e=esc(r.t).replace(/\n/g,'<br>');return r.b?'<b>'+e+'</b>':r.i?'<i>'+e+'</i>':r.c?'<code>'+e+'</code>':e}).join('');
const paras=s=>refs(String(s||'')).split(/\n{2,}/).map(x=>x.trim()).filter(Boolean);
const lines=s=>refs(String(s||'')).split('\n').map(x=>x.trim()).filter(Boolean);
const plain=s=>runs(s).map(r=>r.t).join('');

function coverHTML(d){
  const m=d.meta,rows=[['Nom',m.nom],['Classe',m.classe],['Date',fmtDate(m.date)],['Professeur',m.prof]].filter(r=>r[1]);
  return '<div class="cover"><div class="etab">'+esc(m.etab||'')+'</div><h1>'+esc(m.titre)+'</h1><div class="mod">'+esc(m.module)+'</div>'+
    (rows.length?'<dl>'+rows.map(r=>'<dt>'+r[0]+'</dt><dd>'+esc(r[1])+'</dd>').join('')+'</dl>':'')+'</div><div class="pb"></div>';
}
function tocItems(d){const n=numbers(d);return d.blocks.filter(b=>b.type==='titre'&&b.text.trim()).map(b=>({l:b.level,n:n[b.id],t:b.text.trim()}))}
function tocHTML(d,pgmap){const it=tocItems(d);return it.length?'<nav class="toc"><h2>Sommaire</h2><ol>'+it.map(x=>'<li class="l'+x.l+'">'+esc(x.n)+' '+esc(x.t)+(pgmap&&pgmap[x.id]?'<span>'+pgmap[x.id]+'</span>':'')+'</li>').join('')+'</ol></nav>':''}
function blockOut(b,n){
  let h='';
  if(b.type==='titre'){const t='h'+(b.level+1);h+='<'+t+' class="r-t'+b.level+'">'+esc(n[b.id])+' '+esc(b.text)+'</'+t+'>'}
  else if(b.type==='texte')h+=paras(b.text).map(p=>'<p class="r-p">'+inl(p)+'</p>').join('');
  else if(b.type==='question'||b.type==='reponse'){const q=b.type==='question',ps=paras(b.text);if(!ps.length)ps.push('');
    h+='<div class="qa r-'+(q?'q':'r')+'">'+ps.map((p,i)=>'<p>'+(i===0&&q&&n[b.id]?'<span class="qn">'+esc(n[b.id])+'</span>':'')+inl(p)+'</p>').join('')+'</div>'}
  else if(b.type==='liste'){const t=b.ordered?'ol':'ul';h+='<'+t+' class="r-p">'+lines(b.text).map(l=>'<li>'+inl(l)+'</li>').join('')+'</'+t+'>'}
  else if(b.type==='code'){h+='<pre><code>'+esc(b.text)+'</code></pre>'+(b.cap?'<div class="ccap">'+esc(n[b.id])+' : '+esc(b.cap)+'</div>':'<div style="height:8px"></div>')}
  else if(b.type==='bulle')h+='<div class="nt" data-k="'+b.kind+'"><div class="lb">'+NOTE[b.kind]+'</div>'+paras(b.text).map(p=>'<p>'+inl(p)+'</p>').join('')+'</div>';
  else if(b.type==='image'&&b.src)h+='<figure class="fig"><img src="'+b.src+'" alt="'+esc(b.cap)+'" style="width:'+b.w+'%"><figcaption class="cap">'+esc(n[b.id])+(b.cap?' : '+esc(b.cap):'')+'</figcaption></figure>';
  else if(b.type==='tableau'){const [hd,...rs]=b.rows;
    h+='<div class="tblw"><table class="tbl"><thead><tr>'+hd.map(c=>'<th>'+inl(c)+'</th>').join('')+'</tr></thead><tbody>'+rs.map(r=>'<tr>'+r.map(c=>'<td>'+inl(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div><div class="cap" style="margin:4px 0 12px">'+esc(n[b.id])+(b.cap?' : '+esc(b.cap):'')+'</div>'}
  return h;
}
/* pg = résultat de paginate(); marks = repères « Page n » visibles (aperçu écran) */
function toHTMLBody(d,pg,marks){
  const n=numbers(d),mk=(p,first)=>marks?'<div class="pgdiv'+(first?' first':'')+'">'+(marks===2?'':'Page '+p)+'</div>':'';
  let h='',page=1;
  if(d.cover){h+=mk(1,1)+'<div class="ob cov">'+coverHTML(d)+'</div>';page=2}
  const pm=pg&&pg.tocPage?{}:null;
  let first=true,forceNext=false;
  if(d.toc){const t=tocHTML(d);if(t){h+=(d.cover?mk(2):mk(1,1))+'<div class="ob'+(d.cover?' ps':'')+'" data-id="__toc">'+tocHTML(d,pg&&pg.titlePage)+'</div>';first=false}}
  d.blocks.forEach(b=>{
    if(b.type==='saut'){forceNext=true;return}
    const st=pg&&pg.start[b.id];
    const isStart=st&&(first?false:true);
    let cls='ob';
    if(forceNext||(isStart&&(d.opts.smart))||(first&&d.cover&&!d.toc))cls+=' ps';
    if(marks&&(forceNext||isStart||(first&&!d.cover&&!d.toc)||(first&&d.cover&&!d.toc)))h+=mk(pg&&pg.pageOf[b.id]||page+1,first&&!d.cover);
    forceNext=false;first=false;
    h+='<div class="'+cls+'" data-id="'+b.id+'">'+blockOut(b,n)+'</div>';
  });
  return h;
}

/* Markdown */
function toMD(d){
  const n=numbers(d),m=d.meta;let o='# '+m.titre+'\n\n';
  const info=[['Module',m.module],['Nom',m.nom],['Classe',m.classe],['Date',fmtDate(m.date)],['Professeur',m.prof],['Établissement',m.etab]].filter(r=>r[1]);
  if(d.cover&&info.length)o+=info.map(r=>'**'+r[0]+'** : '+r[1]).join('  \n')+'\n\n';
  if(d.toc){const it=tocItems(d);if(it.length)o+='## Sommaire\n\n'+it.map(x=>'  '.repeat(x.l-1)+'- '+x.n+' '+x.t).join('\n')+'\n\n'}
  d.blocks.forEach(b=>{
    if(b.type==='titre')o+='#'.repeat(b.level+1)+' '+n[b.id]+' '+b.text+'\n\n';
    else if(b.type==='texte')o+=b.text.trim()+'\n\n';
    else if(b.type==='question')o+=(n[b.id]?'**'+n[b.id]+' :** ':'')+b.text.trim()+'\n\n';
    else if(b.type==='reponse')o+=b.text.trim().split('\n').map(l=>'> '+l).join('\n')+'\n\n';
    else if(b.type==='liste')o+=lines(b.text).map((l,i)=>(b.ordered?(i+1)+'. ':'- ')+l).join('\n')+'\n\n';
    else if(b.type==='code')o+='```'+(b.lang==='text'?'':b.lang)+'\n'+b.text.replace(/\s+$/,'')+'\n```\n\n'+(b.cap?'*'+n[b.id]+' : '+b.cap+'*\n\n':'');
    else if(b.type==='bulle')o+=('**'+NOTE[b.kind]+'** : '+b.text.trim()).split('\n').map(l=>'> '+l).join('\n')+'\n\n';
    else if(b.type==='image'&&b.src)o+='!['+(b.cap||n[b.id])+']('+b.src+')\n\n*'+n[b.id]+(b.cap?' : '+b.cap:'')+'*\n\n';
    else if(b.type==='tableau'){const c=s=>String(s).replace(/\|/g,'\\|').replace(/\n/g,' ');
      o+='| '+b.rows[0].map(c).join(' | ')+' |\n|'+b.rows[0].map(()=>'---').join('|')+'|\n'+b.rows.slice(1).map(r=>'| '+r.map(c).join(' | ')+' |').join('\n')+'\n\n*'+n[b.id]+(b.cap?' : '+b.cap:'')+'*\n\n'}
    else if(b.type==='saut')o+='---\n\n';
  });
  return o.replace(/\n{3,}/g,'\n\n').trim()+'\n';
}

/* Texte brut */
function toTXT(d){
  const n=numbers(d),m=d.meta;let o=m.titre.toUpperCase()+'\n'+'='.repeat(Math.max(3,m.titre.length))+'\n';
  [['Module',m.module],['Nom',m.nom],['Classe',m.classe],['Date',fmtDate(m.date)],['Professeur',m.prof],['Établissement',m.etab]].filter(r=>r[1]).forEach(r=>o+=r[0]+' : '+r[1]+'\n');
  o+='\n';
  if(d.toc){const it=tocItems(d);if(it.length)o+='SOMMAIRE\n'+it.map(x=>'  '.repeat(x.l-1)+x.n+' '+x.t).join('\n')+'\n\n'}
  d.blocks.forEach(b=>{
    if(b.type==='titre'){const t=n[b.id]+' '+b.text;o+=(b.level===1?t.toUpperCase()+'\n'+'-'.repeat(t.length):t)+'\n\n'}
    else if(b.type==='texte')o+=plain(b.text).trim()+'\n\n';
    else if(b.type==='question')o+=(n[b.id]?n[b.id]+' : ':'')+plain(b.text).trim()+'\n\n';
    else if(b.type==='reponse')o+='Réponse : '+plain(b.text).trim()+'\n\n';
    else if(b.type==='liste')o+=lines(b.text).map((l,i)=>(b.ordered?(i+1)+'. ':'- ')+plain(l)).join('\n')+'\n\n';
    else if(b.type==='code')o+=b.text.replace(/\s+$/,'').split('\n').map(l=>'    '+l).join('\n')+'\n'+(b.cap?'    ['+n[b.id]+' : '+b.cap+']\n':'')+'\n';
    else if(b.type==='bulle')o+='['+NOTE[b.kind]+'] '+plain(b.text).trim()+'\n\n';
    else if(b.type==='image'&&b.src)o+='['+n[b.id]+(b.cap?' : '+b.cap:'')+']\n\n';
    else if(b.type==='tableau'){const w=b.rows[0].map((_,c)=>Math.max(...b.rows.map(r=>plain(r[c]).length)));
      const row=r=>r.map((c,i)=>plain(c).padEnd(w[i])).join(' | ');
      o+=row(b.rows[0])+'\n'+w.map(x=>'-'.repeat(x)).join('-+-')+'\n'+b.rows.slice(1).map(row).join('\n')+'\n['+n[b.id]+(b.cap?' : '+b.cap:'')+']\n\n'}
    else if(b.type==='saut')o+='\n';
  });
  return o.replace(/\n{3,}/g,'\n\n').trim()+'\n';
}

/* Page web autonome */

}

/* ===== DOCX fait main : ZIP (sans compression) + XML Word ===== */
const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRCT[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function zip(files){
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  files.forEach(f=>{
    const nm=enc.encode(f.name),data=f.data,crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);
    lh.setUint16(10,0,true);lh.setUint16(12,0x5A21,true);lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);
    lh.setUint32(22,data.length,true);lh.setUint16(26,nm.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),nm,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);
    ch.setUint16(12,0,true);ch.setUint16(14,0x5A21,true);ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);
    ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
    cd.push(new Uint8Array(ch.buffer),nm);
    off+=30+nm.length+data.length;
  });
  const cdSize=cd.reduce((a,x)=>a+x.length,0);
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);
  end.setUint32(12,cdSize,true);end.setUint32(16,off,true);
  return new Blob([...parts,...cd,new Uint8Array(end.buffer)],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}
const xe=s=>String(s??'').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function wr(t,o={}){
  const pr=(o.c?'<w:rFonts w:ascii="Consolas" w:hAnsi="Consolas" w:cs="Consolas"/>':'')+(o.b?'<w:b/>':'')+(o.i?'<w:i/>':'')+(o.col?'<w:color w:val="'+o.col+'"/>':'')+(o.sz?'<w:sz w:val="'+o.sz+'"/><w:szCs w:val="'+o.sz+'"/>':'')+(o.c?'<w:shd w:val="clear" w:color="auto" w:fill="EEF1F5"/>':'');
  const rp=pr?'<w:rPr>'+pr+'</w:rPr>':'';
  return String(t).split('\n').map((l,i)=>'<w:r>'+rp+(i?'<w:br/>':'')+'<w:t xml:space="preserve">'+xe(l)+'</w:t></w:r>').join('');
}
const wruns=(s,base={})=>runs(s).map(r=>wr(r.t,Object.assign({},base,r.b?{b:1}:{},r.i?{i:1}:{},r.c?{c:1}:{}))).join('');
function wp(inner,o={}){
  const pp=(o.style?'<w:pStyle w:val="'+o.style+'"/>':'')+(o.keep?'<w:keepNext/>':'')+
   (o.bar?'<w:pBdr><w:left w:val="single" w:sz="36" w:space="8" w:color="'+o.bar+'"/></w:pBdr>':'')+
   (o.shd?'<w:shd w:val="clear" w:color="auto" w:fill="'+o.shd+'"/>':'')+
   ((o.before!=null||o.after!=null)?'<w:spacing'+(o.before!=null?' w:before="'+o.before+'"':'')+(o.after!=null?' w:after="'+o.after+'"':'')+'/>':'')+

/* ===== Pagination mesurée : repères « Page n » et option intelligente (question + réponse ensemble) ===== */
const PAGE_H=945; // hauteur utile A4 (257 mm = 971 px) moins une marge de sécurité
let pg=null,pgT=0,pgRun=0;
async function paginate(d){
  const m=$('#measure');m.style.cssText=styleVars(d.style);
  const n=numbers(d),items=[];
  if(d.toc){const t=tocHTML(d);if(t)items.push({id:'__toc',html:t})}
  d.blocks.forEach(b=>{items.push({id:b.id,b,html:b.type==='saut'?'':blockOut(b,n)})});
  m.innerHTML=items.map((x,i)=>'<div class="ob" data-i="'+i+'">'+x.html+'</div>').join('');
  if(document.fonts&&document.fonts.ready){try{await document.fonts.ready}catch(e){}}
  // attendre les images
  await Promise.all([...m.querySelectorAll('img')].map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r})));
  const hs=[...m.children].map(e=>e.offsetHeight);
  m.innerHTML='';
  const smart=!!d.opts.smart;
  const keepNext=(it,nx)=>{
    if(!nx||!it.b)return false;
    if(it.b.type==='titre')return nx.b&&nx.b.type!=='saut';
    if(it.b.type==='question')return smart&&nx.b&&nx.b.type==='reponse';
    return false;
  };
  // regroupement en unités insécables
  const units=[];let cur=null;
  items.forEach((it,i)=>{
    const h=hs[i]||0;
    if(it.b&&it.b.type==='saut'){if(cur){units.push(cur);cur=null}units.push({brk:true,ids:[],h:0});return}
    if(!cur)cur={ids:[],h:0};cur.ids.push(it.id);cur.h+=h;
    if(!keepNext(it,items[i+1])){units.push(cur);cur=null}
  });
  if(cur)units.push(cur);
  const start={},pageOf={},titlePage={};let page=d.cover?2:1,y=0,fresh=true,total=page;
  units.forEach(u=>{
    if(u.brk){if(y>0||!fresh){page++;y=0;fresh=true}return}
    if(!fresh&&y+u.h>PAGE_H&&u.h<=PAGE_H){page++;y=0;fresh=true;u.ids.forEach((id,k)=>{if(!k)start[id]=true})}
    else if(fresh&&u.ids[0]&&!u.ids[0].startsWith('__')&&page>(d.cover?2:1)){start[u.ids[0]]=true}
    u.ids.forEach(id=>{pageOf[id]=page});
    // un élément plus haut qu'une page déborde : on avance le compteur
    y+=u.h;fresh=false;
    while(y>PAGE_H){y-=PAGE_H;page++}
    if(y===0)y=1;
  });

  d.blocks.forEach(b=>{if(b.type==='titre')titlePage[b.id]=pageOf[b.id]});
  const res={start,pageOf,titlePage,total,hs:items.map((x,i)=>[x.id,hs[i]])};
  return res;
}

function drawMarks(){

  const first=doc.cover?2:1,lab=!!doc.opts.marks;
  const mark=(p,txt)=>{const d=document.createElement('div');d.className='pgmark'+(paper?' paper':'');d.innerHTML=lab?('Page '+p+(txt?' <small>'+txt+'</small>':'')):'';return d};
  const box=$('#blocks');
  if(doc.blocks.length){
    const f=$('.ins',box);if(f&&!paper)box.insertBefore(mark(first,''),f);
    let forceNext=false;
    doc.blocks.forEach((b,i)=>{
      if(b.type==='saut'){forceNext=true;return}
      const el=$('.blk[data-id="'+b.id+'"]',box);if(!el)return;
      if(pg.start[b.id]||forceNext){

/* Mode « feuilles » : chaque page remplit une hauteur de feuille A4 */
function paperFit(box,sel){sel=sel||'.pgmark.paper';
  const A4=1123,PAD=76,sh=$('.sheet');if(!sh)return;
  let top=sh.getBoundingClientRect().top;const pl=parseFloat(getComputedStyle(sh).paddingLeft)||0,pr=parseFloat(getComputedStyle(sh).paddingRight)||0;
  const all=sel==='.pgmark.paper'?$$(sel,box):$$(sel+',.pgdiv.endp',box);
  all.forEach(m=>{
    if(m.classList.contains('endp')){m.style.height='0px';const y=m.getBoundingClientRect().top;m.style.height=Math.max(0,A4-PAD-(y-top))+'px';return}
    m.style.marginLeft=-pl+'px';m.style.marginRight=-pr+'px';m.style.marginTop=PAD+'px';
    const y=m.getBoundingClientRect().top;

  const N=pages.length,hex=[...('﻿'+title)].map(ch=>ch.charCodeAt(0).toString(16).padStart(4,'0')).join('');
  obj(1,'<</Type/Catalog/Pages 2 0 R>>');
  obj(2,'<</Type/Pages/Count '+N+'/Kids['+pages.map((_,i)=>(4+3*i)+' 0 R').join(' ')+']>>');
  obj(3,'<</Title<'+hex+'>/Producer(Docline)>>');
  pages.forEach((p,i)=>{
    const pid=4+3*i,cid=pid+1,iid=pid+2,cs='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
    obj(pid,'<</Type/Page/Parent 2 0 R/MediaBox[0 0 595.28 841.89]/Resources<</XObject<</Im0 '+iid+' 0 R>>>>/Contents '+cid+' 0 R>>');
    obj(cid,'<</Length '+cs.length+'>>\nstream\n'+cs+'\nendstream');
    off[iid]=pos;put(iid+' 0 obj\n<</Type/XObject/Subtype/Image/Width '+p.w+'/Height '+p.h+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+p.data.length+'>>\nstream\n');put(p.data);put('\nendstream\nendobj\n');
  });
  const total=4+3*N,xr=pos;
  put('xref\n0 '+total+'\n0000000000 65535 f \n');
  for(let n=1;n<total;n++)put(String(off[n]).padStart(10,'0')+' 00000 n \n');
  put('trailer\n<</Size '+total+'/Root 1 0 R/Info 3 0 R>>\nstartxref\n'+xr+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'});
}

/* Images : réduction à 1800 px max, PNG ou JPEG (compatibles Word) */
function readImage(file){
  return new Promise((ok,ko)=>{
    if(!file||!/^image\//.test(file.type))return ko(new Error('Ce fichier n’est pas une image ('+(file&&file.type||'type inconnu')+')'));
    const fr=new FileReader();
    fr.onerror=()=>ko(new Error('Lecture du fichier impossible'));
    fr.onload=()=>{const im=new Image();
      im.onerror=()=>ko(new Error('Image illisible ou format non pris en charge ('+file.type+')'));
      im.onload=()=>{
        const k=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight));
        const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);
        const g=c.getContext('2d');const jp=file.type==='image/jpeg';
        if(jp){g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height)}
        g.drawImage(im,0,0,c.width,c.height);
        let out=c.toDataURL(jp?'image/jpeg':'image/png',.88);
        if(!jp&&out.length>1200000){const c2=document.createElement('canvas');c2.width=c.width;c2.height=c.height;const g2=c2.getContext('2d');g2.fillStyle='#fff';g2.fillRect(0,0,c.width,c.height);g2.drawImage(c,0,0);out=c2.toDataURL('image/jpeg',.88)}
        ok(out);
      };im.src=fr.result};
    fr.readAsDataURL(file);
  });
}

function dl(name,blob){
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),5000);toast('Fichier créé : '+name+' (dossier Téléchargements)');driveExport(name,blob);
}
function copyText(t,label){
  const fb=()=>{const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}x.remove();
    if(ok)toast(label+' copié');else showErr(new Error('Copie refusée par le navigateur. Utilise l’export en fichier.'),'copie')};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast(label+' copié'),fb);else fb();
}
async function doExport(k){
  try{
    const s=slug();
    if(k==='pdf')await exportPDF();
    else if(k==='print'){closeModal();setMode('view');schedulePages(true);toast('Dans la fenêtre d’impression : « Enregistrer au format PDF »');setTimeout(()=>{try{window.print()}catch(e){showErr(e,'PDF')}},900)}
    else if(k==='docx')dl(s+'.docx',await toDOCX(doc));
    else if(k==='md')dl(s+'.md',new Blob([toMD(doc)],{type:'text/markdown;charset=utf-8'}));
    else if(k==='txt')dl(s+'.txt',new Blob([toTXT(doc)],{type:'text/plain;charset=utf-8'}));
    else if(k==='html')dl(s+'.html',new Blob([toHTMLFile(doc)],{type:'text/html;charset=utf-8'}));
    else if(k==='cpmd')copyText(toMD(doc),'Markdown');
    else if(k==='cptxt')copyText(toTXT(doc),'Texte');
  }catch(e){showErr(e,'export '+k)}
}
function saveJson(){try{dl(slug()+'.json',new Blob([JSON.stringify(doc)],{type:'application/json'}))}catch(e){showErr(e,'enregistrement')}}
function readJson(f){
  return new Promise((ok,ko)=>{const fr=new FileReader();fr.onerror=()=>ko(new Error('Lecture impossible : '+f.name));
    fr.onload=()=>{try{ok(ensureDoc(JSON.parse(fr.result)))}catch(e){ko(e)}};fr.readAsText(f)});
}
async function openFile(f){
  try{
    const raw=await new Promise((ok,ko)=>{const fr=new FileReader();fr.onerror=()=>ko(new Error('Lecture impossible : '+f.name));fr.onload=()=>ok(fr.result);fr.readAsText(f)});
    let o;try{o=JSON.parse(raw)}catch(x){throw new Error('Ce fichier n’est pas un JSON valide : '+f.name)}
    if(o&&Array.isArray(o.tps)){await importBundle(o);return}
  }catch(e){showErr(e,'ouverture de '+f.name);return}
  try{const d=await readJson(f);const ex=await store.get(d.id);if(ex&&ex.updated>d.updated){d.id='tp-'+Date.now().toString(36)}
    await store.put(d);await openDoc(d.id);toast('Ouvert : '+f.name)}catch(e){showErr(e,'ouverture de '+f.name)}
}

/* Évènements de l'éditeur */
function bindEditor(){
  $('#mEdit').onclick=()=>setMode('edit');$('#mView').onclick=()=>setMode('view');
  $('#bStyle').onclick=()=>panelTab==='style'?closePanel():openPanel('style');
  $('#bPages').onclick=()=>panelTab==='pages'?closePanel():openPanel('pages');
  $('#bTP').onclick=()=>panelTab==='tp'?closePanel():openPanel('tp');
  $('#bExport').onclick=openExport;$('#bHome').onclick=goHome;
  bindStyle($('#panel'));
  document.addEventListener('click',e=>{
    if(screenNow!=='editor')return;
    const ib=e.target.closest('[data-ins]');
    $$('.ins.open').forEach(x=>{if(!x.contains(e.target))x.classList.remove('open')});
    if(ib){ib.parentNode.classList.toggle('open');return}
    if(e.target.closest('[data-close]')){closePanel();closeModal();return}
    if(e.target.id==='backdrop'){closeModal();return}
    const sl=e.target.closest('[data-sl]');if(sl){e.preventDefault();slashPick(+sl.dataset.sl);return}
    if(!e.target.closest('#slash'))slashClose();
    const ck=e.target.closest('[data-chk]');if(ck){goBlock(ck.dataset.chk);return}
    if(e.target.closest('#uUndo')){undo();return}if(e.target.closest('#uRedo')){redo();return}
    const a=e.target.closest('[data-add]');
    if(a&&a.dataset.add==='images'){$('#fImgs').click();return}
    if(a&&a.dataset.add==='enonce'){openEnonce();return}
    if(a){const row=a.closest('.ins');if(row)row.classList.remove('open');insert(mk(a.dataset.add),row?(row.dataset.after||'__start'):null);return}
    const x=e.target.closest('[data-exp]');if(x){doExport(x.dataset.exp);return}
    const tb=e.target.closest('[data-tab]');if(tb){openPanel(tb.dataset.tab);return}
    const go=e.target.closest('[data-goto]');if(go){const el=$('[data-id="'+go.dataset.goto+'"]');if(mode==='edit'&&el)el.scrollIntoView({block:'center',behavior:'smooth'});return}
    const so=e.target.closest('[data-opt]');if(so){const k=so.dataset.opt,on=so.getAttribute('aria-checked')!=='true';
      if(k==='cover'||k==='toc')doc[k]=on;else doc.opts[k]=on;redraw();openPanel('pages');return}
    const sc=e.target.closest('[data-struct]');if(sc){
      if(armStruct===sc.dataset.struct){armStruct=null;setStructure(allStructs().find(z=>z.id===sc.dataset.struct))}else{armStruct=sc.dataset.struct;openPanel('tp')}return}
    if(e.target.closest('#saveStruct')){const nm=($('#newStructName').value||'').trim();if(!nm){showErr(new Error('Donne un nom à la structure.'),'structure');return}
      const L=userStructs();L.push(docToStruct(doc,nm));saveStructs(L);toast('Structure « '+nm+' » enregistrée');return}
    if(e.target.closest('#goSettings')){save(true);openSettings('structs');return}
    if(e.target.closest('[data-help]')){openHelp();return}
    if(e.target.closest('#pSave')){saveJson();return}if(e.target.closest('#pOpen')){$('#fOpen').click();return}
    const act=e.target.closest('#blocks [data-act]'),blk=e.target.closest('.blk');
    if(blk&&!act){sel=blk.dataset.id;$$('.blk.sel').forEach(z=>z.classList.remove('sel'));blk.classList.add('sel');syncRole(doc.blocks[idx(sel)])}
    if(!act||!blk)return;
    const id=blk.dataset.id,i=idx(id),b=doc.blocks[i];
    switch(act.dataset.act){
      case'up':moveBlock(id,-1);break;
      case'down':moveBlock(id,1);break;
      case'dup':{const c=clone(b);c.id=uid();doc.blocks.splice(i+1,0,c);sel=c.id;redraw()}break;
      case'del':doc.blocks.splice(i,1);sel=null;redraw();break;
      case'w':b.w=+act.dataset.w;redraw();break;
      case'ref':copyText('{fig:'+id+'}','Renvoi');toast('Renvoi copié : colle-le dans un texte (ou tape / dans un texte)');break;
      case'img':imgTarget=id;$('#fImg').click();break;
      case'annot':openAnnot(id);break;
      case'addrow':b.rows.push(b.rows[0].map(()=>''));redraw();break;
      case'addcol':b.rows.forEach(r=>r.push(''));redraw();break;
      case'delrow':if(b.rows.length>1){b.rows.pop();redraw()}break;
      case'delcol':if(b.rows[0].length>1){b.rows.forEach(r=>r.pop());redraw()}break;
    }
  });
  $('#panel').addEventListener('input',e=>{const t=e.target;if(t.dataset.meta){doc.meta[t.dataset.meta]=t.value;renderCover();updateHead();save()}});
  const bl=$('#blocks');
  bl.addEventListener('input',e=>{
    const t=e.target,blk=t.closest('.blk');if(!blk)return;
    const b=doc.blocks[idx(blk.dataset.id)];if(!b)return;
    if(t.dataset.r!==undefined)b.rows[+t.dataset.r][+t.dataset.c]=t.value;
    else if(t.dataset.f&&t.tagName!=='SELECT'){b[t.dataset.f]=t.value;if(t.tagName==='TEXTAREA')autosize(t)}
    save();schedulePages();commitLater();
    if(t.tagName==='TEXTAREA')slashCheck(t);
  });
  bl.addEventListener('change',e=>{
    const t=e.target,blk=t.closest('.blk');if(!blk||t.tagName!=='SELECT'||!t.dataset.f)return;
    const b=doc.blocks[idx(blk.dataset.id)];
    if(t.dataset.f==='level')b.level=+t.value;else if(t.dataset.f==='ordered')b.ordered=t.value==='1';else b[t.dataset.f]=t.value;
    sel=b.id;redraw();syncRole(b);
  });
  bl.addEventListener('keydown',e=>{
    if(slashKey(e))return;
    const t=e.target,blk=t.closest('.blk');if(!blk)return;
    const id=blk.dataset.id,b=doc.blocks[idx(id)];if(!b)return;
    if(e.key==='Enter'&&t.matches('.hd input')&&!e.ctrlKey){e.preventDefault();insert(mk('texte'),id)}
  });
  $('#fImg').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)addImage(f,imgTarget);imgTarget=null};
  $('#fImgs').onchange=e=>{const f=[...e.target.files];e.target.value='';addImages(f)};
  $('#fThemes').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)impThemes(f)};
  $('#fOpen').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)openFile(f)};
  document.addEventListener('paste',e=>{
    if(screenNow!=='editor'||mode!=='edit')return;
    const it=[...(e.clipboardData&&e.clipboardData.items||[])].find(x=>x.kind==='file'&&/^image\//.test(x.type));
    if(it){e.preventDefault();addImage(it.getAsFile(),null);return}
    const tx=e.clipboardData&&e.clipboardData.getData('text/plain'),tg=e.target,blk=tg.closest&&tg.closest('.blk');
    if(tx&&blk&&tg.tagName==='TEXTAREA'){const b=doc.blocks[idx(blk.dataset.id)];if(b&&['texte','question','reponse'].includes(b.type)&&!tg.value.trim()){const en=parseEnonce(tx,{rep:true}),nq=en.filter(x=>x.type==='question').length;if(nq>=2){e.preventDefault();const id=b.id;insertMany(en,id);const k=idx(id);if(k>=0){doc.blocks.splice(k,1);redraw()}toast('Énoncé découpé en '+nq+' questions (Ctrl+Z pour annuler)');return}}if(b&&!['code','bulle'].includes(b.type)&&looksTerminal(tx)){e.preventDefault();pasteTerminal(tx,b.id)}}
  });
  const sh=$('#sheet');
  sh.addEventListener('dragover',e=>e.preventDefault());
  sh.addEventListener('drop',e=>{
    const fs=[...(e.dataTransfer&&e.dataTransfer.files||[])];if(!fs.length)return;e.preventDefault();
    const im=fs.filter(f=>/^image\//.test(f.type));if(im.length)addImages(im);
    fs.filter(f=>!/^image\//.test(f.type)).forEach(f=>{if(/json$/.test(f.name))openFile(f);else showErr(new Error('Fichier non pris en charge : '+f.name),'dépôt')});
  });
  document.addEventListener('keydown',e=>{
    if(screenNow!=='editor')return;
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save(true);toast('Enregistré dans Mes TP')}
    if(e.key==='Escape'){if(!$('#modal').hidden)closeModal();else if(panelTab)closePanel()}
    dispatchKey(e);
  });
  window.addEventListener('resize',()=>{});
}

/* ===== Raccourcis clavier : modifiables, enregistrés dans le navigateur ===== */
const KACT=[
 {id:'save',g:'Général',n:'Enregistrer',d:'Ctrl+S',any:1},
 {id:'export',g:'Général',n:'Exporter (PDF, Word…)',d:'Ctrl+P',any:1},
 {id:'mode',g:'Général',n:'Éditer / Aperçu',d:'Alt+M',any:1},
 {id:'help',g:'Général',n:'Afficher les raccourcis',d:'F1',any:1},
 {id:'palette',g:'Général',n:'Palette de commandes (tout chercher)',d:'Ctrl+K',any:1},
 {id:'focus',g:'Général',n:'Mode concentration',d:'Alt+Z',any:1},
 {id:'dockpos',g:'Général',n:'Barre de blocs : gauche / bas',d:'Alt+B',any:1},
 {id:'home',g:'Général',n:'Retour à Mes TP',d:'',any:1},
 {id:'p_style',g:'Panneaux',n:'Panneau Style',d:'',any:1},
 {id:'p_pages',g:'Panneaux',n:'Panneau Pages',d:'',any:1},
 {id:'p_tp',g:'Panneaux',n:'Panneau TP (infos, structures)',d:'',any:1},
 {id:'a_titre',g:'Ajouter un bloc après le bloc actuel',n:'Titre',d:'Alt+T',blk:'titre'},
 {id:'a_texte',g:'Ajouter un bloc après le bloc actuel',n:'Texte (paragraphe)',d:'Alt+P',blk:'texte'},
 {id:'a_question',g:'Ajouter un bloc après le bloc actuel',n:'Question',d:'Alt+Q',blk:'question'},
 {id:'a_reponse',g:'Ajouter un bloc après le bloc actuel',n:'Réponse',d:'Alt+R',blk:'reponse'},
 {id:'a_code',g:'Ajouter un bloc après le bloc actuel',n:'Code',d:'Alt+C',blk:'code'},
 {id:'a_image',g:'Ajouter un bloc après le bloc actuel',n:'Image',d:'Alt+I',blk:'image'},
 {id:'a_tableau',g:'Ajouter un bloc après le bloc actuel',n:'Tableau (grille)',d:'Alt+G',blk:'tableau'},
 {id:'a_bulle',g:'Ajouter un bloc après le bloc actuel',n:'Bulle (note)',d:'Alt+N',blk:'bulle'},
 {id:'a_liste',g:'Ajouter un bloc après le bloc actuel',n:'Liste',d:'Alt+L',blk:'liste'},
 {id:'a_saut',g:'Ajouter un bloc après le bloc actuel',n:'Saut de page',d:'Alt+K',blk:'saut'},
 {id:'enonce',g:'Ajouter un bloc après le bloc actuel',n:'Coller un énoncé (une question par bloc)',d:'Alt+E'},
 {id:'undo',g:'Déplacer et organiser',n:'Annuler',d:'Ctrl+Z'},
 {id:'redo',g:'Déplacer et organiser',n:'Rétablir',d:'Ctrl+Shift+Z'},
 {id:'redo2',g:'Déplacer et organiser',n:'Rétablir (autre raccourci)',d:'Ctrl+Y'},
 {id:'next',g:'Ajouter un bloc après le bloc actuel',n:'Bloc suivant (réponse après une question, sinon texte)',d:'Ctrl+Enter'},
 {id:'up',g:'Déplacer et organiser',n:'Monter le bloc',d:'Alt+ArrowUp'},
 {id:'down',g:'Déplacer et organiser',n:'Descendre le bloc',d:'Alt+ArrowDown'},
 {id:'prev',g:'Déplacer et organiser',n:'Aller au bloc précédent',d:'Alt+PageUp'},
 {id:'nextb',g:'Déplacer et organiser',n:'Aller au bloc suivant',d:'Alt+PageDown'},
 {id:'dup',g:'Déplacer et organiser',n:'Dupliquer le bloc',d:'Alt+Shift+D'},
 {id:'del',g:'Déplacer et organiser',n:'Supprimer le bloc',d:'Alt+Delete'}];
const KRES=new Set(['Ctrl+C','Ctrl+V','Ctrl+X','Ctrl+A','Ctrl+Z','Ctrl+Y','Ctrl+F','Ctrl+W','Ctrl+T','Ctrl+N','Ctrl+Q','Ctrl+R','Ctrl+L','Ctrl+Tab','Alt+F4','Alt+Tab','Ctrl+Shift+T','Ctrl+Shift+N','Ctrl+Shift+W']);
const KKEY='cr-keys-v1';
function keyOver(){try{const o=JSON.parse(localStorage.getItem(KKEY)||'{}');return o&&typeof o==='object'?o:{}}catch(e){return{}}}
function keySave(o){try{localStorage.setItem(KKEY,JSON.stringify(o))}catch(e){showErr(e,'raccourcis non enregistrés')}}
function keyOf(a){const o=keyOver();return Object.prototype.hasOwnProperty.call(o,a.id)?o[a.id]:a.d}
function combo(e){
  const k=e.key;if(!k||['Control','Alt','Shift','Meta','AltGraph','Dead','Process','CapsLock'].includes(k))return null;
  let n=k.length===1?(k===' '?'Space':k.toUpperCase()):k;
  const p=[];if(e.ctrlKey||e.metaKey)p.push('Ctrl');if(e.altKey)p.push('Alt');if(e.shiftKey)p.push('Shift');
  return p.concat(n).join('+');
}
const KPRET={Shift:'Maj',ArrowUp:'↑',ArrowDown:'↓',ArrowLeft:'←',ArrowRight:'→',Delete:'Suppr',PageUp:'PageHaut',PageDown:'PageBas',Enter:'Entrée',Space:'Espace',Backspace:'Retour',Escape:'Échap'};
const pretty=c=>c?c.split('+').map(x=>KPRET[x]||x).join(' + '):'';
let krec=null;
function kbd(t,x){return '<kbd'+(x?' class="'+x+'"':'')+'>'+(t||'—')+'</kbd>'}
function keysList(edit){
  const o=keyOver();let g='',h='';
  KACT.forEach(a=>{
    if(a.g!==g){if(g)h+='</div>';g=a.g;h+='<div class="lbl">'+esc(g)+'</div><div class="grp">'}
    const c=keyOf(a),custom=Object.prototype.hasOwnProperty.call(o,a.id)&&o[a.id]!==a.d;
    h+='<div class="rw krow"><span>'+esc(a.n)+'</span><span class="kr">'+
      (edit?'<button class="kb'+(krec===a.id?' rec':'')+'" data-krec="'+a.id+'" aria-label="Changer le raccourci : '+esc(a.n)+'">'+(krec===a.id?'Appuie sur les touches…':(c?pretty(c):'Aucun'))+'</button>'+
        (c&&krec!==a.id?'<button class="kx" data-kclear="'+a.id+'" aria-label="Retirer" title="Retirer">✕</button>':'')+
        (custom&&krec!==a.id?'<button class="kx" data-kreset="'+a.id+'" aria-label="Valeur d’origine" title="Valeur d’origine">↺</button>':''):kbd(pretty(c)))+'</span></div>';
  });
  return h+'</div>';
}
function keysBox(){return '<div class="keysbox">'+keysList(true)+'<div style="display:flex;gap:8px;margin-top:14px"><button class="ghost" data-kresetall style="height:44px;font-size:13px">Tout remettre par défaut</button></div>'+
  '<p style="color:var(--mute);font-size:12px;line-height:16px;margin:10px 4px 0">Clique sur un raccourci, puis appuie sur la nouvelle combinaison (avec Ctrl ou Alt). Échap annule. Les raccourcis sont gardés dans ce navigateur.</p></div>'}
function refreshKeys(){
  const kb=$('#modal .keysbox');if(kb&&!$('#modal').hidden){const sc=$('#modal').scrollTop;kb.outerHTML=keysBox();$('#modal').scrollTop=sc}
  if(screenNow==='settings'&&setTab==='keys')renderSettings();
  const p=$('#kPop');if(p)p.innerHTML=keysPopHTML();
}
function keysPopHTML(){return '<div style="padding:4px 6px 2px">'+keysList(false)+'</div><hr><button data-kedit>Modifier les raccourcis…</button>'}
function openHelp(){
  openModal('<div class="sh-head"><div><div class="sh-t">Raccourcis clavier</div><div class="sh-s">Clique sur un raccourci pour le changer</div></div><button class="cl" data-close aria-label="Fermer"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>'+keysBox());
  $('#kMenu')&&$('#kMenu').classList.remove('open');
}
function setKey(id,c){
  const a=KACT.find(x=>x.id===id),o=keyOver();
  if(c){
    if(!/^F\d+$/.test(c.split('+').pop())&&!/(Ctrl|Alt)/.test(c)){toast('Ajoute Ctrl ou Alt à la combinaison');return false}
    if(KRES.has(c)){toast(pretty(c)+' est réservé par le navigateur');return false}
    const other=KACT.find(x=>x.id!==id&&keyOf(x)===c);if(other){toast(pretty(c)+' est déjà utilisé pour « '+other.n+' »');return false}
  }
  if(c===a.d)delete o[id];else o[id]=c;keySave(o);return true;
}
function curBlockId(){const a=document.activeElement,b=a&&a.closest&&a.closest('.blk');return b?b.dataset.id:sel}
function runKey(a){
  if(a.any){
    switch(a.id){
      case'save':save(true);toast('Enregistré dans Mes TP');break;
      case'export':if($('#modal').hidden)openExport();break;
      case'mode':setMode(mode==='edit'?'view':'edit');break;
      case'help':$('#modal').hidden?openHelp():closeModal();break;
      case'home':goHome();break;
      case'palette':openPalette();break;
      case'focus':toggleFocus();break;
      case'dockpos':toggleDock();break;
      case'p_style':case'p_pages':case'p_tp':{const t=a.id.slice(2);panelTab===t?closePanel():openPanel(t)}break;
    }
    return;
  }
  if(mode!=='edit'||!$('#modal').hidden)return;
  const id=curBlockId(),i=id?idx(id):-1;
  if(a.blk){insert(mk(a.blk),id||null);return}
  switch(a.id){
    case'enonce':openEnonce();break;
    case'undo':undo();break;
    case'redo':case'redo2':redo();break;
    case'next':{const b=i>=0?doc.blocks[i]:null;insert(mk(b&&b.type==='question'?'reponse':'texte'),id||null)}break;
    case'up':if(i>=0)moveBlock(id,-1);break;
    case'down':if(i>=0)moveBlock(id,1);break;
    case'prev':case'nextb':{const j=Math.max(0,Math.min(doc.blocks.length-1,(i<0?0:i)+(a.id==='prev'?-1:1)));if(doc.blocks[j]){sel=doc.blocks[j].id;focusBlock(sel)}}break;
    case'dup':if(i>=0){const c=clone(doc.blocks[i]);c.id=uid();doc.blocks.splice(i+1,0,c);sel=c.id;redraw();focusBlock(c.id)}break;
    case'del':if(i>=0){doc.blocks.splice(i,1);sel=null;redraw();toast('Bloc supprimé')}break;
  }
}
function dispatchKey(e){
  if(!doc||e.isComposing||krec)return;
  const c=combo(e);if(!c)return;
  const a=KACT.find(x=>keyOf(x)===c);if(!a)return;
  if(['undo','redo','redo2'].includes(a.id)&&e.target.closest&&e.target.closest('#panel,#modal'))return;
  e.preventDefault();runKey(a);
}
function bindKeys(){
  // enregistrement d'une nouvelle combinaison (prioritaire sur tout)
  window.addEventListener('keydown',e=>{
    if(!krec)return;
    e.preventDefault();e.stopPropagation();
    if(e.key==='Escape'){krec=null;refreshKeys();return}
    const c=combo(e);if(!c)return;
    const id=krec;if(setKey(id,c)){krec=null;toast('Raccourci : '+pretty(c))}else{krec=null}
    refreshKeys();
  },true);
  document.addEventListener('click',e=>{
    const r=e.target.closest('[data-krec]');if(r){krec=r.dataset.krec;refreshKeys();return}
    const c=e.target.closest('[data-kclear]');if(c){setKey(c.dataset.kclear,'');refreshKeys();return}
    const z=e.target.closest('[data-kreset]');if(z){const o=keyOver();delete o[z.dataset.kreset];keySave(o);refreshKeys();return}
    if(e.target.closest('[data-kresetall]')){keySave({});refreshKeys();toast('Raccourcis remis par défaut');return}
    if(e.target.closest('[data-kedit]')){openHelp();return}
    if(e.target.closest('#bKeys')){const m=$('#kMenu');const o=!m.classList.contains('open');m.classList.toggle('open',o);if(o)$('#kPop').innerHTML=keysPopHTML();return}
    const m=$('#kMenu');if(m&&!e.target.closest('#kMenu'))m.classList.remove('open');
  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){const m=$('#kMenu');if(m)m.classList.remove('open');if(krec){krec=null}}});
}

/* --- Annuler / rétablir : on garde des copies légères des blocs (les images ne sont pas dupliquées en mémoire) --- */
const HI={h:[],i:-1,lock:false,t:0};
const snap=()=>doc.blocks.map(b=>{const c=Object.assign({},b);if(c.rows)c.rows=c.rows.map(r=>r.slice());return c});
function sameSnap(a,b){
  if(a.length!==b.length)return false;
  for(let i=0;i<a.length;i++){const x=a[i],y=b[i],kx=Object.keys(x);if(kx.length!==Object.keys(y).length)return false;
    for(const k of kx){if(k==='rows'){if(JSON.stringify(x.rows)!==JSON.stringify(y.rows))return false}else if(x[k]!==y[k])return false}}
  return true;
}
function histReset(){HI.h=[snap()];HI.i=0;updUndo()}
function commit(){
  if(HI.lock||!doc)return;const s=snap();if(HI.h[HI.i]&&sameSnap(HI.h[HI.i],s))return;
  HI.h=HI.h.slice(0,HI.i+1);HI.h.push(s);if(HI.h.length>100)HI.h.shift();HI.i=HI.h.length-1;updUndo();
}
function commitLater(){clearTimeout(HI.t);HI.t=setTimeout(commit,600)}
function updUndo(){const u=$('#uUndo'),r=$('#uRedo');if(u)u.disabled=HI.i<=0;if(r)r.disabled=HI.i>=HI.h.length-1}
function goHist(d){
  clearTimeout(HI.t);commit();
  const j=HI.i+d;if(j<0||j>=HI.h.length){toast(d<0?'Rien à annuler':'Rien à rétablir');return}
  const old=snap();HI.i=j;
  doc.blocks=HI.h[j].map(b=>{const c=Object.assign({},b);if(c.rows)c.rows=c.rows.map(r=>r.slice());return c});
  const ch=doc.blocks.find((b,i)=>!old[i]||!sameSnap([old[i]],[b]));
  HI.lock=true;try{sel=ch?ch.id:null;redraw()}finally{HI.lock=false}updUndo();
  if(ch&&mode==='edit')focusBlock(ch.id);
  toast(d<0?'Annulé':'Rétabli');
}
const undo=()=>goHist(-1),redo=()=>goHist(1);

function insertMany(arr,afterId){
  if(!arr.length)return;
  let pos=afterId==='__start'?0:(()=>{const i=afterId?idx(afterId):(sel?idx(sel):-1);return i<0?doc.blocks.length:i+1})();
  doc.blocks.splice(pos,0,...arr);sel=arr[0].id;redraw();
}

/* --- Coller l'énoncé du prof : une question par bloc --- */
function parseEnonce(txt,o){
  const L=String(txt||'').replace(/\r/g,'').split('\n');
  const reHead=/^\s*(?:#{1,3}\s+(.+)|((?:partie|exercice|activité|étape|objectif|travail demandé|mise en situation|présentation|situation|contexte|conclusion)\b[^?]{0,60}))\s*$/i;
  const reQ=[/^\s*(?:question|q)\s*n?°?\s*(\d{1,2}(?:\.\d{1,2})?)\s*[.):\-–—]*\s*(.*)$/i,/^\s*(\d{1,2}(?:\.\d{1,2})?)\s*[.)°\-–—]+\s+(.*)$/];
  const reSub=/^\s*(?:[a-h][.)]|[-•*–])\s+/i;
  const out=[];let cur=null,pre=[];
  const flushQ=()=>{if(!cur)return;out.push(mk('question',{text:cur.join('\n\n').replace(/\n\n(?=\S)/g,m=>m)}));if(o.rep)out.push(mk('reponse'));cur=null};
  L.forEach(raw=>{
    const l=raw.trim();
    if(!l){return}
    let m=null;for(const r of reQ){m=l.match(r);if(m)break}
    const h=!m&&l.match(reHead);
    if(h){flushQ();if(pre.length){out.push(mk('texte',{text:pre.join(' ')}));pre=[]}out.push(mk('titre',{level:1,text:(h[1]||h[2]).trim().replace(/[:.]$/,'')}));return}
    if(m){flushQ();if(pre.length){out.push(mk('texte',{text:pre.join(' ')}));pre=[]}cur=[(m[2]||'').trim()];return}
    if(cur){if(reSub.test(l))cur.push(l);else cur[cur.length-1]=(cur[cur.length-1]+' '+l).trim()}
    else pre.push(l);
  });
  flushQ();if(pre.length)out.push(mk('texte',{text:pre.join(' ')}));
  return out;
}

   '<p id="enInfo" style="margin-top:10px">Colle le texte ci-dessus.</p><button class="go full" id="enGo" disabled style="margin-top:8px">Insérer</button>');

    go.disabled=!b.length;go.textContent=b.length?'Insérer '+b.length+' blocs':'Insérer';

/* --- Coller une sortie de terminal : devient un bloc Code --- */
const rePrompt=/^\s*(?:\$|[\w.-]+@[\w.-]+:[^\s]*[$#]|PS [A-Za-z]:\\[^>]*>|>>>)\s*\S/;
function looksTerminal(t){
  const L=String(t||'').split('\n').filter(l=>l.trim());if(!L.length)return false;
  const p=L.filter(l=>rePrompt.test(l)).length;return p>=1&&p>=L.length*0.15;
}
function pasteTerminal(text,id){
  const i=idx(id),b=doc.blocks[i],txt=text.replace(/\r/g,'').replace(/\s+$/,'');
  const lang=/^\s*>>>/m.test(txt)?'python':/^\s*PS /m.test(txt)?'powershell':'bash';
  const nb=mk('code',{lang,text:txt});
  if(b&&['texte','reponse','question'].includes(b.type)&&!b.text.trim()){doc.blocks.splice(i,1,nb);sel=nb.id;redraw()}
  else insert(nb,id);
  toast('Collé en bloc Code (Ctrl+Z pour annuler)');
}

const SL={open:false,items:[],k:0,id:null,el:null};
function slashItems(f){
  const nrm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();f=nrm(f);
  const it=[['titre','Titre','titre'],['texte','Texte','texte paragraphe'],['question','Question','question'],['reponse','Réponse','reponse'],['code','Code','code commande terminal'],['image','Image','image capture figure'],['tableau','Tableau','tableau grille'],['bulle','Bulle','bulle note remarque'],['liste','Liste','liste puces'],['saut','Saut de page','saut page']].map(x=>({kind:'blk',t:x[0],l:x[1],s:x[2]}));

  return it.filter(x=>!f||nrm(x.l+' '+x.s).includes(f)).slice(0,9);
}
function slashDraw(){
  let p=$('#slash');if(!p){p=document.createElement('div');p.id='slash';document.body.appendChild(p)}
  const r=SL.el.getBoundingClientRect();p.style.left=Math.max(8,Math.min(r.left+16,innerWidth-270))+'px';
  const below=r.bottom+250<innerHeight;p.style.top=below?(r.bottom+4)+'px':'auto';p.style.bottom=below?'auto':(innerHeight-r.top+4)+'px';

  p.hidden=false;
}
function slashClose(){SL.open=false;const p=$('#slash');if(p)p.hidden=true}
function slashCheck(t){
  const v=t.value,pos=t.selectionStart,m=v.slice(0,pos).match(/(^|\n)\/([\wéèêàç]*)$/i);
  if(!m){if(SL.open)slashClose();return}
  SL.el=t;SL.id=t.closest('.blk').dataset.id;SL.f=m[2];SL.start=pos-m[2].length-1;SL.items=slashItems(m[2]);SL.k=0;SL.open=true;slashDraw();
}
function slashPick(i){
  const x=SL.items[i];if(!x)return;const t=SL.el,b=doc.blocks[idx(SL.id)];
  t.value=t.value.slice(0,SL.start)+t.value.slice(t.selectionStart);b.text=t.value;slashClose();
  if(x.kind==='ref'){const ins='{fig:'+x.id+'}';b.text=b.text.slice(0,SL.start)+ins+b.text.slice(SL.start);t.value=b.text;t.focus();t.setSelectionRange(SL.start+ins.length,SL.start+ins.length);autosize(t);save();commitLater();return}
  const empty=!b.text.trim()&&b.type==='texte';
  if(empty){const nb=mk(x.t);doc.blocks.splice(idx(SL.id),1,nb);sel=nb.id;redraw();if(x.t!=='image')focusBlock(nb.id)}
  else{t.dispatchEvent(new Event('input',{bubbles:true}));insert(mk(x.t),SL.id);}
}
function slashKey(e){
  if(!SL.open)return false;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();SL.k=(SL.k+(e.key==='ArrowDown'?1:-1)+SL.items.length)%Math.max(1,SL.items.length);slashDraw();return true}
  if(e.key==='Enter'||e.key==='Tab'){if(SL.items.length){e.preventDefault();slashPick(SL.k);return true}}
  if(e.key==='Escape'){e.preventDefault();slashClose();return true}
  return false;
}

/* --- Contrôle avant d'exporter --- */
function checkDoc(d){
  const n=numbers(d),out=[],B=d.blocks,txt=b=>(b.text||'').trim();
  B.forEach((b,i)=>{
    const nx=B[i+1],lab=n[b.id]||'';
    if(b.type==='question'){
      if(!txt(b))out.push({id:b.id,m:lab+' : énoncé vide'});
      if(!(nx&&nx.type==='reponse'&&txt(nx)))out.push({id:b.id,m:lab+' : pas de réponse'});
    }else if(b.type==='titre'){
      if(!txt(b))out.push({id:b.id,m:'Titre vide'});
      else if(!nx||(nx.type==='titre'&&nx.level<=b.level))out.push({id:b.id,m:'Section « '+b.text+' » vide'});
    }else if(b.type==='image'){
      if(!b.src)out.push({id:b.id,m:'Image manquante'});else if(!(b.cap||'').trim())out.push({id:b.id,m:lab+' : sans légende'});
    }else if(['texte','liste','code','bulle'].includes(b.type)&&!txt(b))out.push({id:b.id,m:({texte:'Texte',liste:'Liste',code:'Code',bulle:'Bulle'})[b.type]+' vide'});
    else if(b.type==='tableau'&&!b.rows.slice(1).some(r=>r.some(c=>c.trim())))out.push({id:b.id,m:lab+' : aucune valeur remplie'});
  });
  if(!d.meta.titre.trim())out.push({id:null,m:'Titre du TP manquant (page de garde)'});
  if(d.cover&&!d.meta.nom.trim())out.push({id:null,m:'Ton nom manque sur la page de garde'});
  return out;
}

  for(const id in remote){c.map[id]=remote[id].id}dsave(c);
  const local=await store.all();
  for(const f of Object.values(remote)){
    const l=local.find(x=>x.id===f.appProperties.docId),ru=+f.appProperties.updated||0;
    if(!l||ru>l.updated){
      const t=await(await dfetch('https://www.googleapis.com/drive/v3/files/'+f.id+'?alt=media')).text();
      const d=ensureDoc(JSON.parse(t));d.updated=Math.max(d.updated,ru);await store.put(d);down++;
    }
  }
  for(const l of local){const f=remote[l.id];if(!f||(+f.appProperties.updated||0)<l.updated){await drivePush(l);up++}}
  const c2=dcfg();c2.last=Date.now();c2.pending=[];dsave(c2);
  return{up,down};
}

  doc=null;await renderHome();show('home');
}
async function openDoc(id){
  const d=await store.get(id);if(!d)throw new Error('TP introuvable dans la bibliothèque.');
  doc=ensureDoc(d);sel=null;pg=null;armStruct=null;
  applyStyle();renderCover();renderBlocks();updateHead();setMode('edit');closePanel();setSave('Enregistré');histReset();show('editor');$$('#blocks textarea').forEach(autosize);
  schedulePages(true);
}
const PAL=[['#6A5BFF','#2B2680'],['#2563EB','#12306E'],['#15803D','#0B3B1E'],['#D97706','#6B3503'],['#DB2777','#5B1038'],['#0F766E','#083B37'],['#7C3AED','#3B1B7A']];
async function createDoc(sid,layoutId,title){
  const prev=libCache[0],p=prefs();
  const s=sid==='exemple'?{name:'Exemple',b:EXAMPLE}:allStructs().find(x=>x.id===sid)||BLANK;
  const d=newDoc(buildStruct(s),{titre:title||(sid==='exemple'?'TP n°1 : Configuration réseau sous Linux':'Nouveau TP'),module:sid==='exemple'?'Systèmes et réseaux':'',
    nom:p.nom||(prev&&prev.meta.nom)||'',classe:p.classe||(prev&&prev.meta.classe)||'BTS CIEL',etab:p.etab||(prev&&prev.meta.etab)||'',prof:''},layoutById(layoutId||p.layout));
  await store.put(d);await openDoc(d.id);
}
let newSel=null;
function openNewTP(sid){
  const p=prefs(),us=userStructs();
  newSel={sid:sid||(us[0]?us[0].id:'blanc'),layout:p.layout,title:''};renderNewTP();
}
function renderNewTP(){
  const st=allStructs().concat([{id:'exemple',name:'Exemple pour essayer',blocks:EXAMPLE()}]);
  const lay=allThemes().map(t=>'<button class="th-c'+(newSel.layout===t.id?' on':'')+'" data-nlay="'+esc(t.id)+'" style="height:72px"><span class="aa" style="color:'+t.roles.t1.color+';font-size:19px">Aa</span><i class="ln" style="top:36px;background:'+(t.roles.q.bar||t.roles.q.color)+'"></i><span class="nm">'+esc(t.name)+'</span>'+(newSel.layout===t.id?'<span class="ck">'+CHK+'</span>':'')+'</button>').join('');
  openModal('<div class="sh-head"><div><div class="sh-t">Nouveau TP</div><div class="sh-s">Choisis la structure et la mise en page</div></div><button class="cl" data-close aria-label="Fermer"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>'+
   '<div class="fl" style="margin-top:12px"><label for="nt_title">Titre du TP</label><input class="inp" id="nt_title" value="'+esc(newSel.title)+'" placeholder="Ex. TP n°3 : Pare-feu iptables"></div>'+
   '<div class="lbl">Structure</div><div class="chipsel">'+st.map(x=>'<button class="pill'+(newSel.sid===x.id?' act':'')+'" data-nsid="'+x.id+'">'+esc(x.name)+(x.blocks?' <small style="color:var(--mute)">'+x.blocks.length+'</small>':'')+'</button>').join('')+
   '<button class="pill" data-gosettings="structs">+ Mes structures</button></div>'+
   '<div class="lbl">Mise en page</div><div class="themes" style="grid-template-columns:repeat(3,minmax(0,1fr))">'+lay+'</div>'+
   '<div style="display:flex;gap:8px;margin-top:16px"><button class="go full" data-ncreate>Créer le TP</button></div>'+
   '<button class="ghost" data-gosettings="layouts" style="margin-top:8px;height:42px;font-size:13px">Régler mes mises en page</button>');
  const t=$('#nt_title');if(t){t.oninput=()=>{newSel.title=t.value}}
}
function bindModal(){
  document.addEventListener('click',async e=>{
    try{
      if(e.target.closest('[data-close]')||e.target.id==='backdrop'){closeModal();return}
      const ns=e.target.closest('[data-nsid]');if(ns){newSel.sid=ns.dataset.nsid;renderNewTP();return}
      const nl=e.target.closest('[data-nlay]');if(nl){newSel.layout=nl.dataset.nlay;renderNewTP();return}
      if(e.target.closest('[data-ncreate]')){const t=($('#nt_title')||{}).value||'';closeModal();await createDoc(newSel.sid,newSel.layout,t.trim());return}
      const gs=e.target.closest('[data-gosettings]');if(gs){closeModal();openSettings(gs.dataset.gosettings);return}
      const tp=e.target.closest('[data-tplpick]');if(tp){const p=PRESETS.find(x=>x.id===tp.dataset.tplpick),L=userStructs(),s=presetToStruct(p);L.push(s);saveStructs(L);setStructId=s.id;closeModal();renderSettings();toast('Modèle copié : modifie-le comme tu veux');return}
    }catch(er){showErr(er,'nouveau TP')}
  });
}
function coverCard(sid,name,sub,i){
  const c=sid==='blanc'?['#475569','#1E293B']:sid==='exemple'?['#334155','#0F172A']:PAL[i%PAL.length];
  return '<button class="bk" data-new="'+sid+'"><div class="cv" style="background:linear-gradient(160deg,'+c[0]+','+c[1]+')"><div class="lns"></div><div class="ct" style="font-size:'+(name.length>14?15:17)+'px">'+esc(name)+'</div></div><div class="t">'+esc(name)+'</div><div class="a">'+esc(sub)+'</div></button>';
}
function docCard(d){
  const st=docStats(d);
  return '<div class="it" data-doc="'+d.id+'"><button class="open" data-open="'+d.id+'"><span class="th"></span><span class="bd"><span class="tt" style="display:block">'+esc(d.meta.titre||'Sans titre')+'</span>'+
    '<span class="au" style="display:block">'+esc(d.meta.module||'—')+' · '+ago(d.updated)+'</span><span><span class="tg2 a">'+esc(d.style.name||'Perso')+'</span><span class="tg2">'+st.q+' question'+(st.q>1?'s':'')+'</span><span class="tg2">'+d.blocks.length+' blocs</span></span></span></button>'+
    '<button class="mini" data-dup="'+d.id+'" aria-label="Dupliquer" title="Dupliquer"><svg class="ic" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button>'+
    '<button class="mini danger" data-del="'+d.id+'" aria-label="Supprimer" title="Supprimer"><svg class="ic" viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg></button></div>';
}
async function renderHome(){
  let docs=[];try{docs=await store.all()}catch(e){showErr(e,'lecture de la bibliothèque')}
  libCache=docs;const last=docs[0],h=$('#home');
  let hero;
  if(last){const st=docStats(last),pc=st.sections?Math.round(100*st.filled/st.sections):0;
    hero='<div><div class="eyebrow">REPRENDRE</div><h1>'+esc(last.meta.titre||'Sans titre')+'</h1><div class="sub">'+esc(last.meta.module||'')+(last.meta.module?' · ':'')+'modifié '+ago(last.updated)+'</div>'+
     '<div class="pbar" style="margin-top:20px;width:min(420px,100%)"><i style="width:'+pc+'%"></i></div><div style="margin-top:8px;font-size:13px;color:var(--mute)">'+st.filled+' section'+(st.filled>1?'s':'')+' sur '+st.sections+' remplie'+(st.filled>1?'s':'')+' · '+st.q+' question'+(st.q>1?'s':'')+'</div>'+
     '<button class="go" data-open="'+last.id+'" style="margin-top:20px;height:54px;padding:0 34px;font-size:16px">Continuer</button></div>';
  }else hero='<div><div class="eyebrow">BIENVENUE</div><h1>Tes comptes rendus, sans prise de tête.</h1><div class="sub">Choisis une structure, remplis les blocs, exporte en PDF ou Word.</div><button class="go" data-new="exemple" style="margin-top:20px;height:54px;padding:0 30px;font-size:16px">Essayer avec un exemple</button></div>';
  const cur=last?last.style:BUILTIN[1],q=cur.roles.q;
  const stack='<div class="pstack" aria-hidden="true"><div class="pg a"></div><div class="pg b"></div><div class="pg c" style="color:'+cur.roles.t1.color+'">3. Manipulations<i style="background:'+(q.bg||'#EEF3FA')+';border-left:3px solid '+(q.bar||q.color)+'"></i><i style="background:'+(cur.roles.r.bg||'#F2FAF4')+';border-left:3px solid '+(cur.roles.r.bar||'#999')+';height:22px"></i><i style="background:#F3F5F8;border:1px solid #D5DAE2;height:44px"></i></div></div>';
  const fst=(folder.supported()?folderCard():'')+driveCard();
  h.innerHTML='<div id="homeBanner"></div><section class="hero">'+hero+stack+'</section>'+
   '<div class="rowh"><h2>Nouveau TP</h2><button data-gosettings="structs" style="color:var(--acc2);font-weight:600;font-size:13px">Mes structures</button></div><div class="covers">'+allStructs().map((s,i)=>coverCard(s.id,s.name,s.blocks.length+' blocs',i)).join('')+coverCard('exemple','Exemple','Pour essayer',9)+
   '<button class="bk" data-gosettings="structs"><div class="cv blank"><svg class="ic" viewBox="0 0 24 24" style="width:30px;height:30px"><path d="M12 5v14M5 12h14"/></svg></div><div class="t">Ma structure</div><div class="a">Créer la mienne</div></button></div>'+
   '<div class="rowh"><h2>Mes TP</h2><span>'+docs.length+' sur cet ordinateur</span></div>'+
   (docs.length?'<div class="list">'+docs.map(docCard).join('')+'</div>':'<div class="empty" style="margin-top:14px">Aucun TP pour l’instant. Choisis une structure ci-dessus.</div>')+fst;
  if(store.mode!=='idb')$('#homeBanner').innerHTML='<div class="banner"><span>Stockage de secours (localStorage) : les images lourdes peuvent ne pas tenir. Pense à « Enregistrer .json ».</span></div>';
}
function folderCard(){
  const st=folder.state;
  const msg=st==='ok'?'Dossier relié : chaque TP y est copié à chaque sauvegarde.':st==='ask'?'Dossier relié, mais le navigateur demande la permission à chaque ouverture.':'Relie un dossier (clé USB, ou dossier Google Drive pour ordinateur) pour y garder une copie de chaque TP.';
  return '<div class="rowh"><h2>Sur la clé USB</h2><span>Chrome / Edge</span></div><div class="grp" style="margin-top:14px"><div class="rw" style="padding:12px 16px"><span>'+msg+'<small>Les TP restent aussi dans ce navigateur. Fichier .tp.json copiable sur n’importe quel ordinateur.</small></span></div>'+
   '<div class="rw" style="gap:8px;justify-content:flex-start;flex-wrap:wrap;padding:10px 14px">'+
   (st==='ok'?'<button class="pill" data-f="sync">Tout copier maintenant</button><button class="pill" data-f="import">Importer depuis le dossier</button><button class="pill" data-f="forget">Délier</button>':st==='ask'?'<button class="pill act" data-f="regrant">Autoriser le dossier</button><button class="pill" data-f="forget">Délier</button>':'<button class="pill act" data-f="connect">Choisir un dossier</button>')+'</div></div>';
}
const armDel={id:null,t:0};
function bindHome(){
  $('#home').addEventListener('click',async e=>{
    try{
      const o=e.target.closest('[data-open]');if(o){await openDoc(o.dataset.open);return}
      const n=e.target.closest('[data-new]');if(n){openNewTP(n.dataset.new);return}
      const du=e.target.closest('[data-dup]');if(du){const d=await store.get(du.dataset.dup);const c=clone(d);c.id='tp-'+Date.now().toString(36)+uid().slice(0,3);c.meta.titre+=' (copie)';c.updated=Date.now();await store.put(c);if(folder.state==='ok')try{await folder.write(c)}catch(x){}await renderHome();toast('TP dupliqué');return}
      const de=e.target.closest('[data-del]');if(de){
        const id=de.dataset.del;
        if(armDel.id===id){armDel.id=null;await store.del(id);await renderHome();toast('TP supprimé');return}
        armDel.id=id;de.classList.add('arm');de.textContent='Supprimer ?';clearTimeout(armDel.t);armDel.t=setTimeout(()=>{armDel.id=null;renderHome()},3500);return}
      const gs2=e.target.closest('[data-gosettings]');if(gs2){openSettings(gs2.dataset.gosettings);return}
      const f=e.target.closest('[data-f]');if(f){
        const k=f.dataset.f;
        if(k==='connect'){await folder.connect();await renderHome();toast('Dossier relié')}
        else if(k==='regrant'){await folder.regrant();await renderHome()}
        else if(k==='forget'){await folder.forget();await renderHome()}
        else if(k==='sync'){const a=await store.all();for(const d of a)await folder.write(d);toast(a.length+' TP copiés dans le dossier')}
        else if(k==='import'){const a=await folder.readAll();let c=0;for(const x of a){try{const d=ensureDoc(x);const ex=await store.get(d.id);if(!ex||ex.updated<d.updated){await store.put(d);c++}}catch(er){}}await renderHome();toast(c+' TP importé(s) ou mis à jour')}
      }
    }catch(er){if(er&&er.name==='AbortError')return;showErr(er,'accueil')}
  });
  $('#hOpen').onclick=()=>$('#fOpen').click();
  $('#hNew').onclick=()=>openNewTP();$('#hSet').onclick=()=>openSettings('layouts');
}
/* ===== Démarrage ===== */
(async function(){
  try{
    await store.init();await folder.init();
    // migration de l'ancienne sauvegarde unique
    try{const r=localStorage.getItem(OLDKEY);if(r&&!localStorage.getItem('cr-migrated')){
      const d=JSON.parse(r);if(d&&Array.isArray(d.blocks)){const nd=ensureDoc(d);nd.id='tp-ancien';nd.meta.titre=(nd.meta.titre||'TP')+' (ancienne sauvegarde)';await store.put(nd)}
      localStorage.setItem('cr-migrated','1')}}catch(e){console.warn(e)}
    bindEditor();bindKeys();bindDrive();bindLight();bindBackup();bindUX();bindAnnot();bindHistory();bindHome();bindSettings();bindModal();
    await renderHome();show('home');driveInit();
    if(folder.state==='ok'){/* copie silencieuse au démarrage non nécessaire */}
  }catch(e){showErr(e,'démarrage')}
})();

/* Application installable (version hébergée en https) */
let installEv=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEv=e;const b=$('#hInstall');if(b)b.hidden=false});
window.addEventListener('appinstalled',()=>{installEv=null;const b=$('#hInstall');if(b)b.hidden=true;toast('Application installée')});
document.addEventListener('click',async e=>{
  if(!e.target.closest('#hInstall')||!installEv)return;
  try{installEv.prompt();await installEv.userChoice}catch(er){showErr(er,'installation')}
});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&document.querySelector('link[rel=manifest]')){
  navigator.serviceWorker.register('sw.js').catch(e=>showErr(e,'mode hors ligne (service worker)'));
}
